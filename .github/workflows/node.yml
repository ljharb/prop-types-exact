name: 'Tests: node.js'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.set-matrix.outputs.requireds }}
      minors: ${{ steps.set-matrix.outputs.optionals }}
    steps:
      - uses: ljharb/actions/node/matrix@main
        id: set-matrix
        with:
          versionsAsRoot: true
          type: majors
          preset: '>= 0.10' # waiting on https://github.com/gvarsanyi/sync-exec/pull/20 for 0.8

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react:
          - 16
          - 15
          - 15.4
          - 0.14
          - 0.13
    steps:
      - uses: ljharb/actions/node/build@main
        with:
          build-command: npm run react && npm run tests:build
        env:
          REACT: ${{ matrix.react }}
      - name: 'cache build output and node_modules'
        uses: actions/cache/save@v4
        with:
          path: |
            test-build/
            node_modules/
          key: build-output-${{ github.workflow }}-${{ github.run_id }}-react-${{ matrix.react }}

  latest:
    needs: [build, matrix]
    name: 'majors'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.matrix.outputs.latest) }}
        react:
          - 16
          - 15
          - 15.4
          - 0.14
          - 0.13

    steps:
      - uses: actions/checkout@v4
      - uses: ljharb/actions/node/install@main
        name: 'nvm install ${{ matrix.node-version }}'
        with:
          node-version: ${{ matrix.node-version }}
          skip-install: true
          skip-ls-check: true
      - name: 'restore build output and node_modules'
        uses: actions/cache/restore@v4
        with:
          path: |
            test-build/
            node_modules/
          key: build-output-${{ github.workflow }}-${{ github.run_id }}-react-${{ matrix.react }}
          fail-on-cache-miss: true
      - run: npm run tests-only
      - uses: codecov/codecov-action@v3.1.5

  node:
    name: node
    needs: [latest]
    runs-on: ubuntu-latest
    steps:
      - run: true
